<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRONUGGETS // Mission Briefing Cutscene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0c1326 0%, #05070f 65%, #020307 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #f8fafc;
    }

    /* Smooth Page Transition Curtain */
    .page-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #020307;
      opacity: 1;
      pointer-events: none;
      transition: opacity 0.7s ease-in-out;
    }

    .page-transition.loaded {
      opacity: 0;
    }

    .page-transition.leaving {
      opacity: 1;
      pointer-events: all;
    }

    /* Starfield & Approach Canvas */
    canvas#cutscene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Matching Futuristic HUD Grid Overlay */
    .hud-grid {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
    }

    /* Main Cutscene Layout */
    .cutscene-stage {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 1120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .feed-status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: blink 1.2s infinite;
    }

    .home-link {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      color: #e0f2fe;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.5rem 1.15rem;
      border-radius: 999px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .home-link:hover {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.85);
    }

    /* Center Transmission Card */
    .transmission-card {
      width: 100%;
      max-width: 780px;
      background: rgba(11, 17, 32, 0.76);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 22px;
      padding: 2.5rem 2.25rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .phase-badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 0.42rem 1.15rem;
      border-radius: 999px;
      margin-bottom: 1.2rem;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .scene-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.5rem, 4vw, 2.75rem);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 15%, #bae6fd 50%, #38bdf8 80%, #818cf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.35));
    }

    .scanline {
      width: min(320px, 65%);
      height: 2px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
      box-shadow: 0 0 14px #38bdf8;
      opacity: 0.85;
    }

    .dialogue-box {
      min-height: 105px;
      font-size: clamp(1rem, 1.8vw, 1.16rem);
      line-height: 1.75;
      color: #cbd5e1;
      max-width: 640px;
      margin: 0 auto;
    }

    .cursor-bar {
      display: inline-block;
      width: 3px;
      height: 1.1em;
      background: #38bdf8;
      vertical-align: middle;
      margin-left: 4px;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 0.8s infinite;
    }

    /* Bottom Navigation & Next Button */
    .controls-bar {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
    }

    .step-dots {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .dot {
      width: 32px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.28);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      width: 48px;
    }

    .dot.completed {
      background: rgba(56, 189, 248, 0.55);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .next-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.95rem 2.3rem;
      border-radius: 999px;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: #030712;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.48);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .next-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 42px rgba(56, 189, 248, 0.8);
    }

    .skip-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.92rem 1.7rem;
      border-radius: 999px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: #e0f2fe;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .skip-btn:hover {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.85);
      transform: translateY(-2px);
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="page-transition" id="page-transition"></div>
  <canvas id="cutscene-canvas"></canvas>
  <div class="hud-grid"></div>

  <main class="cutscene-stage">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="feed-status">
        <span class="pulse-dot"></span>
        <span>ASTRONUGGETS // TRANSMISSION</span>
      </div>
      <a href="/" class="home-link" id="home-link">&#8592; Home</a>
    </div>

    <!-- Center Cutscene Briefing Box -->
    <section class="transmission-card" aria-live="polite">
      <div class="phase-badge" id="phase-badge">TRANSMISSION 01 // ARRIVAL</div>
      <h1 class="scene-title" id="scene-title">ORBITAL INSERTION</h1>
      <div class="scanline"></div>
      <p class="dialogue-box">
        <span id="dialogue-text"></span><span class="cursor-bar"></span>
      </p>
    </section>

    <!-- Bottom Progress & Next Button -->
    <div class="controls-bar">
      <div class="step-dots" id="step-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="button-row">
        <button type="button" class="next-btn" id="next-btn">
          Next &#9654;
        </button>
        <!-- Replace #your-game-url with your actual game link when ready -->
        <a href="#your-game-url" class="skip-btn" id="skip-link">
          Skip Intro
        </a>
      </div>
    </div>
  </main>

  <script>
    // ==================== GAME DESTINATION URL ====================
    // Replace '#your-game-url' with the URL to your actual game when ready:
    const GAME_DESTINATION_URL = '#your-game-url';

    const transitionEl = document.getElementById('page-transition');
    const homeLink = document.getElementById('home-link');
    const canvas = document.getElementById('cutscene-canvas');
    const ctx = canvas.getContext('2d');

    const phaseBadgeEl = document.getElementById('phase-badge');
    const sceneTitleEl = document.getElementById('scene-title');
    const dialogueTextEl = document.getElementById('dialogue-text');
    const nextBtn = document.getElementById('next-btn');
    const skipLink = document.getElementById('skip-link');
    const dots = document.querySelectorAll('.dot');

    skipLink.href = GAME_DESTINATION_URL;

    // Smooth fade-in on arrival
    requestAnimationFrame(() => {
      transitionEl.classList.add('loaded');
    });

    function navigateWithFade(url) {
      if (!url || url.startsWith('#')) {
        window.location.href = url;
        return;
      }
      transitionEl.classList.remove('loaded');
      transitionEl.classList.add('leaving');
      setTimeout(() => {
        window.location.href = url;
      }, 650);
    }

    homeLink.addEventListener('click', (e) => {
      e.preventDefault();
      navigateWithFade(homeLink.getAttribute('href'));
    });

    skipLink.addEventListener('click', (e) => {
      if (!GAME_DESTINATION_URL.startsWith('#')) {
        e.preventDefault();
        navigateWithFade(GAME_DESTINATION_URL);
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        transitionEl.classList.remove('leaving');
        transitionEl.classList.add('loaded');
      }
    });

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.5 + 0.3,
      alpha: Math.random() * 0.8 + 0.2,
      twinkle: (Math.random() - 0.5) * 0.015,
      speed: Math.random() * 0.4 + 0.1
    }));

    const scenes = [
      {
        badge: 'TRANSMISSION 01 // ARRIVAL',
        title: 'DEEP SPACE INSERTION',
        text: 'Welcome, Cadet. Your vessel has cleared the outer asteroid belt and entered orbit above the Martian frontier. Signal delay to Earth is up to 22 minutes—command authority now rests with you.',
        planetRadiusFactor: 0.18
      },
      {
        badge: 'TRANSMISSION 02 // HAZARD BRIEFING',
        title: 'SOLAR STORMS & RESOURCE DRAIN',
        text: 'Each Martian day—called a Sol—depletes your oxygen, water, power, and supplies. Incoming solar flares and dust storms will force tough trade-offs between shielding, life support, and research.',
        planetRadiusFactor: 0.26
      },
      {
        badge: 'TRANSMISSION 03 // READY FOR LAUNCH',
        title: 'JUNIOR ASTRONAUT MISSION TRAINER',
        text: 'Step into the command console, balance your outpost systems, and keep your crew alive. Your mission begins now.',
        planetRadiusFactor: 0.34
      }
    ];

    let currentScene = 0;
    let charIndex = 0;
    let isTyping = false;
    let typeInterval = null;
    let currentPlanetR = 80;
    let targetPlanetR = 140;

    function updateDots(index) {
      dots.forEach((dot, i) => {
        dot.classList.remove('active', 'completed');
        if (i < index) dot.classList.add('completed');
        if (i === index) dot.classList.add('active');
      });
    }

    function loadScene(index) {
      currentScene = index;
      const scene = scenes[index];

      phaseBadgeEl.textContent = scene.badge;
      sceneTitleEl.textContent = scene.title;
      dialogueTextEl.textContent = '';
      targetPlanetR = Math.min(width, height) * scene.planetRadiusFactor;
      updateDots(index);

      if (index === scenes.length - 1) {
        nextBtn.innerHTML = 'Start Mission &#9654;';
      } else {
        nextBtn.innerHTML = 'Next &#9654;';
      }

      clearInterval(typeInterval);
      charIndex = 0;
      isTyping = true;

      typeInterval = setInterval(() => {
        if (charIndex < scene.text.length) {
          dialogueTextEl.textContent += scene.text[charIndex];
          charIndex++;
        } else {
          clearInterval(typeInterval);
          isTyping = false;
        }
      }, 22);
    }

    nextBtn.addEventListener('click', () => {
      const scene = scenes[currentScene];

      if (isTyping) {
        clearInterval(typeInterval);
        dialogueTextEl.textContent = scene.text;
        isTyping = false;
        return;
      }

      if (currentScene < scenes.length - 1) {
        loadScene(currentScene + 1);
      } else {
        navigateWithFade(GAME_DESTINATION_URL);
      }
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (const s of stars) {
        s.x -= s.speed;
        if (s.x < 0) s.x = width;
        s.alpha += s.twinkle;
        if (s.alpha <= 0.15 || s.alpha >= 1) s.twinkle *= -1;

        ctx.fillStyle = `rgba(224, 242, 254, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      currentPlanetR += (targetPlanetR - currentPlanetR) * 0.03;
      const cx = width / 2;
      const cy = height + currentPlanetR * 0.62;

      const glow = ctx.createRadialGradient(cx, cy, currentPlanetR * 0.75, cx, cy, currentPlanetR * 1.35);
      glow.addColorStop(0, 'rgba(56, 189, 248, 0.25)');
      glow.addColorStop(0.5, 'rgba(129, 140, 248, 0.1)');
      glow.addColorStop(1, 'rgba(2, 3, 7, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, currentPlanetR * 1.35, 0, Math.PI * 2);
      ctx.fill();

      const sphere = ctx.createRadialGradient(
        cx - currentPlanetR * 0.25, cy - currentPlanetR * 0.6, currentPlanetR * 0.1,
        cx, cy, currentPlanetR
      );
      sphere.addColorStop(0, '#1e3a8a');
      sphere.addColorStop(0.45, '#0f172a');
      sphere.addColorStop(1, '#02040a');
      ctx.fillStyle = sphere;
      ctx.beginPath();
      ctx.arc(cx, cy, currentPlanetR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      requestAnimationFrame(animate);
    }

    animate();
    loadScene(0);
  </script>
</body>
</html>
